<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
    <ion-buttons slot="end">
      <ion-select
        [value]="meses()"
        (ionChange)="onJanelaChange($any($event.detail.value))"
        interface="popover"
        fill="outline"
      >
        @for (j of janelas; track j) {
          <ion-select-option [value]="j">Últimos {{ j }} meses</ion-select-option>
        }
      </ion-select>
      <ion-button aria-label="Fechar" (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  @if (chartType === 'line') {
    @if (lineHeadline()) {
      <p class="expanded-headline">{{ lineHeadline() }}</p>
    }
    <div class="expanded-chart-wrap">
      <canvas baseChart role="img" [attr.aria-label]="lineChartLabel()" [type]="'line'" [data]="lineChartData()" [options]="lineChartOptions()"></canvas>
    </div>
  } @else {
    <app-caixa-meta-chart class="expanded-chart-wrap" [rows]="caixaRows()" [expanded]="true"></app-caixa-meta-chart>
  }
</ion-content>
